    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E9C8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="48" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="290" stroke="#D4AF37" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="400" cy="400" r="250" stroke="#10B981" stroke-opacity=".12" stroke-width="1"/>

  <!-- Honey jar -->
  <rect x="448" y="268" width="168" height="278" rx="28" fill="url(#honeyGlass)"/>
  <rect x="468" y="300" width="128" height="210" rx="16" fill="#FBBF24" fill-opacity=".35"/>
  <path d="M490 360h84M490 400h84M490 440h84" stroke="#92400E" stroke-opacity=".25" stroke-width="6"/>
  <rect x="470" y="232" width="124" height="44" rx="8" fill="url(#gold)"/>
  <rect x="494" y="208" width="76" height="28" rx="6" fill="#1F2937"/>
  <ellipse cx="532" cy="548" rx="70" ry="14" fill="#000" opacity=".25"/>

  <!-- Oil bottle -->
