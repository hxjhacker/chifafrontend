  <ellipse cx="310" cy="552" rx="72" ry="16" fill="#000" opacity=".28"/>

  <text x="400" y="680" text-anchor="middle" fill="#F3E9C8" font-size="28" font-family="Georgia, serif" letter-spacing="4">ROYAL POWER</text>
  <text x="400" y="718" text-anchor="middle" fill="#10B981" font-size="20" font-family="Tahoma, sans-serif">'D2J* 'DEDCJ + 'D93D 'DEDCJ</text>
