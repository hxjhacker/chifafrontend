<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="800">
      <stop offset="0%" stop-color="#07140F"/>
      <stop offset="55%" stop-color="#0B1A14"/>
      <stop offset="100%" stop-color="#10231C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oilGlass" x1="250" y1="180" x2="390" y2="620">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="45%" stop-color="#064E3B"/>
