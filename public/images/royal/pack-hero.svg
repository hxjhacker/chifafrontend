  <rect x="258" y="250" width="104" height="250" rx="24" fill="#34D399" fill-opacity=".12"/>
  <path d="M278 320c22 18 64 18 86 0" stroke="#A7F3D0" stroke-opacity=".4" stroke-width="3"/>
  <rect x="276" y="168" width="68" height="56" rx="10" fill="url(#gold)"/>
  <rect x="292" y="132" width="36" height="44" rx="8" fill="#111827"/>
